<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio | OG Desk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <div class="bg-blobs">
        <div class="blob blob-2" style="background: var(--neon-purple);"></div>
    </div>

    <nav>
        <div class="logo">OG Desk.</div>
        <ul class="nav-links">
            <li><a href="index.html">Work</a></li>
            <li><a href="services.html">Expertise</a></li>
            <li><a href="contact.html">Studio</a></li>
        </ul>
        <a href="contact.html" class="btn-nav">Start Project</a>
    </nav>

    <div class="page-header">
        <h1>LET'S BUILD.</h1>
        <p style="opacity: 0.7; font-size: 1.2rem; margin-top: 20px;">Ready to scale? Drop us a line.</p>
        
        <form class="contact-form">
            <input type="text" placeholder="Your Name / Brand Name" required>
            <input type="email" placeholder="Work Email" required>
            <select required>
                <option value="" disabled selected>Select a Service...</option>
                <option>Performance Marketing</option>
                <option>E-Commerce Management</option>
                <option>Licensing & Legal</option>
                <option>Complete 360° Package</option>
            </select>
            <textarea rows="5" placeholder="Tell us about your project..." required></textarea>
            <button type="submit" class="btn-submit">Submit Inquiry</button>
        </form>
    </div>

    <footer>
        <h2>OG Desk.</h2>
        <p>&copy; 2026. All Rights Reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
